# Keeps personal details out of this public repository (see .github/scripts/privacy_guard.py).
name: Privacy guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for personal details
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/privacy_guard.py
