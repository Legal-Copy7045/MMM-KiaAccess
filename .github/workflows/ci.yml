# CI per the project standard (github.com/Legal-Copy7045/project-standards, STANDARD.md section 1).
#  - pull request: nothing while a draft; then the quick checks (node, python, versions, privacy, secrets) and each
#    slow group (hass, hacs, browser) only when its files changed (.github/changes.yaml);
#  - push to main: the private-terms check, and the release path when VERSION has no v<VERSION> tag yet
#    (nothing is re-tested: the pull request already was);
#  - weekly (Sunday 02:47 UTC) and by hand: everything, the full Node/Python matrix, full-history secret scan and
#    dependency audits; publishes nothing (workflow_dispatch with release: true on main retries a release).
# ci-result is the only required check.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "47 2 * * 0"        # Sunday: this project's slot (STANDARD.md 1.6)
  workflow_dispatch:
    inputs:
      release: {type: boolean, default: false, description: "Release VERSION if it has no tag yet (main only)"}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.c.outputs.release }}
      full: ${{ steps.c.outputs.full }}
      hass: ${{ steps.c.outputs.hass }}
      hacs: ${{ steps.c.outputs.hacs }}
      browser: ${{ steps.c.outputs.browser }}
      lockfiles: ${{ steps.c.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: python3 .github/scripts/changes.py

  # ---------------------------------------------------------------- quick (every ready PR, and weekly)

  node:
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest supported on pull requests, the full matrix weekly
        node: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["20", "22", "24"]' || '["20", "24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # No package-lock.json: MagicMirror runs `npm install` in the module folder itself, and the module ships no
      # required dependencies. `npm install` still pulls the optional mqtt package the node_helper tests need.
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Syntax check
        run: |
          for f in MMM-KiaAccess.js node_helper.js webhook.js exporter.js core/*.js ha_source.js setup_python.js \
                   docs/build-gallery.js scripts/*.js card/*.src.js custom_components/kia_access/frontend/kia-access-card.js; do
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: Unit tests
        run: npm test
      - name: HA integration in sync with core/
        run: node scripts/sync-core.js --check
      - name: Gallery is not stale
        run: |
          node docs/build-gallery.js
          if ! git diff --quiet docs/car-states.html; then
            echo "::error::docs/car-states.html is out of date - run: node docs/build-gallery.js"
            git --no-pager diff docs/car-states.html | head -40
            exit 1
          fi
      - name: Dependency audit (package.json changed, or weekly)
        if: matrix.node == '24' && (needs.changes.outputs.lockfiles == 'true' || needs.changes.outputs.full == 'true')
        run: |
          npm install --package-lock-only --ignore-scripts --silent
          npm audit --omit=dev --audit-level=high

  python:
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["3.13", "3.14"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # test/dump_vehicle_test.py imports hyundai_kia_connect_api.exceptions directly
      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml
      - name: Versions (VERSION, manifest.json, package.json, CHANGELOG.md)
        run: python3 .github/scripts/check_versions.py
      - name: Byte-compile
        run: |
          python -m py_compile kia_bridge.py enroll.py kia_client.py conditions.py vehicle_state.py sessions.py analytics.py
          python -m py_compile custom_components/kia_access/*.py
      - name: Python tests (stops at the first failing file and names it)
        run: node scripts/test-python.js --group core --fail-fast
      - name: Dependency audit (requirements changed, or weekly)
        if: matrix.python == '3.13' && (needs.changes.outputs.lockfiles == 'true' || needs.changes.outputs.full == 'true')
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  privacy:
    needs: changes
    if: github.event_name != 'push'
    uses: Legal-Copy7045/project-standards/.github/workflows/privacy.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0

  privacy-denylist:
    needs: changes
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    uses: Legal-Copy7045/project-standards/.github/workflows/privacy.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0
    with: {denylist: true}
    secrets: inherit

  secrets:
    needs: changes
    if: github.event_name != 'push'
    uses: Legal-Copy7045/project-standards/.github/workflows/gitleaks.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0
    with: {full-history: "${{ needs.changes.outputs.full == 'true' }}"}

  # ---------------------------------------------------------------- slow groups (only when their files changed)

  hass:
    needs: changes
    if: needs.changes.outputs.hass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Home Assistant
        run: pip install --quiet homeassistant -r requirements.txt
      - name: Integration tests against Home Assistant (stops at the first failing file and names it)
        run: node scripts/test-python.js --group hass --require-hass --fail-fast

  hacs:
    needs: changes
    if: needs.changes.outputs.hacs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Playwright and Chromium
        run: |
          pip install pyyaml
          npm install --no-save --no-package-lock --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Cards and gallery in Chromium (desktop and phone)
        run: python3 regression/run.py --stage page
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-logs
          path: regression/out/
          retention-days: 3

  # ---------------------------------------------------------------- release (push to main with a new VERSION)

  release:
    needs: [changes, privacy-denylist]
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: write
    uses: Legal-Copy7045/project-standards/.github/workflows/release.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0
    with:
      title: "Kia Access"

  ci-result:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, node, python, privacy, privacy-denylist, secrets, hass, hacs, browser, release]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then echo "A needed job failed or was cancelled."; exit 1; fi
