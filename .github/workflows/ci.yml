name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          for f in MMM-KiaAccess.js node_helper.js webhook.js exporter.js core/flatten.js core/visuals.js core/conditions.js core/state.js core/ha-discovery.js core/sessions.js core/range.js core/routing.js core/isoline.js core/trips.js ha_source.js setup_python.js docs/build-gallery.js scripts/sync-core.js card/kia-access-card.src.js card/kia-range-map-card.src.js custom_components/kia_access/frontend/kia-access-card.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Unit tests
        run: npm test
      - name: HA integration in sync with core/
        run: node scripts/sync-core.js --check
      - name: Gallery is not stale
        run: |
          node docs/build-gallery.js
          if ! git diff --quiet docs/car-states.html; then
            echo "docs/car-states.html is out of date — run: node docs/build-gallery.js"
            git --no-pager diff docs/car-states.html | head -40
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: |
          python -m py_compile kia_bridge.py enroll.py kia_client.py conditions.py vehicle_state.py sessions.py
          python -m py_compile custom_components/kia_access/*.py
      - name: Spec sanity
        run: python test/spec_check.py
      - name: Contract fixtures (Python engine)
        run: python test/contract_test.py
      - name: kia_client.dump_vehicle
        run: python test/dump_vehicle_test.py
      - name: sessions engine
        run: python test/sessions_test.py

      - name: range parity
        run: python test/range_test.py
      - name: routing parity
        run: python test/routing_test.py
      - name: trips parity
        run: python test/trips_test.py

  hass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate config flow / manifest against Home Assistant
        run: |
          pip install --quiet homeassistant
          python test/ha_import_check.py

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
