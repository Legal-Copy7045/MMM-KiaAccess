name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          for f in MMM-KiaAccess.js node_helper.js core/flatten.js core/visuals.js core/conditions.js core/state.js core/ha-discovery.js ha_source.js setup_python.js docs/build-gallery.js scripts/sync-core.js card/kia-access-card.src.js custom_components/kia_access/frontend/kia-access-card.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Unit tests
        run: npm test
      - name: HA integration in sync with core/
        run: node scripts/sync-core.js --check
      - name: Gallery is not stale
        run: |
          node docs/build-gallery.js
          if ! git diff --quiet docs/car-states.html; then
            echo "docs/car-states.html is out of date — run: node docs/build-gallery.js"
            git --no-pager diff docs/car-states.html | head -40
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: |
          python -m py_compile kia_bridge.py enroll.py kia_client.py
          python -m py_compile custom_components/kia_access/*.py
      - name: Spec sanity
        run: python test/spec_check.py

  hass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate config flow / manifest against Home Assistant
        run: |
          pip install --quiet homeassistant
          python test/ha_import_check.py
