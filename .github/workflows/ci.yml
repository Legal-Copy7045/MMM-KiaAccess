name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No package-lock.json (this module deliberately ships zero required
      # deps -- MagicMirror runs `npm install` in the module folder on
      # install anyway) so `npm ci` isn't available here; `npm install`
      # still pulls in the optionalDependencies (mqtt) the node_helper.js
      # mqtt tests need -- without this they fail on every CI run with
      # "mqtt package is installed in this repo -- connect() must return a
      # client object", since require("mqtt") has nothing to find.
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: |
          for f in MMM-KiaAccess.js node_helper.js webhook.js exporter.js core/flatten.js core/visuals.js core/conditions.js core/state.js core/ha-discovery.js core/sessions.js core/range.js core/routing.js core/isoline.js core/trips.js core/dest-planner.js core/analytics.js ha_source.js setup_python.js docs/build-gallery.js scripts/sync-core.js card/kia-access-card.src.js card/kia-range-map-card.src.js custom_components/kia_access/frontend/kia-access-card.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Unit tests
        run: npm test
      - name: HA integration in sync with core/
        run: node scripts/sync-core.js --check
      - name: Gallery is not stale
        run: |
          node docs/build-gallery.js
          if ! git diff --quiet docs/car-states.html; then
            echo "docs/car-states.html is out of date — run: node docs/build-gallery.js"
            git --no-pager diff docs/car-states.html | head -40
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # test/dump_vehicle_test.py imports hyundai_kia_connect_api.exceptions
      # directly (to exercise CommandUnconfirmed's RequestTimeoutError
      # handling) -- without it installed here, that import fails before
      # any assertion even runs.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: |
          python -m py_compile kia_bridge.py enroll.py kia_client.py conditions.py vehicle_state.py sessions.py analytics.py
          python -m py_compile custom_components/kia_access/*.py
      - name: Spec sanity
        run: python test/spec_check.py
      - name: Contract fixtures (Python engine)
        run: python test/contract_test.py
      - name: kia_client.dump_vehicle
        run: python test/dump_vehicle_test.py
      - name: kia_client token file isolation
        run: python test/token_file_test.py
      - name: kia_client auth-failure cooldown
        run: python test/auth_cooldown_test.py
      - name: sessions engine
        run: python test/sessions_test.py

      - name: range parity
        run: python test/range_test.py
      - name: routing parity
        run: python test/routing_test.py
      - name: routing call budget
        run: python test/route_budget_test.py
      - name: trips parity
        run: python test/trips_test.py
      - name: analytics parity
        run: python test/analytics_test.py
      - name: AccountPoller / select_own_vehicle
        run: python test/account_poll_test.py

  hass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate config flow / manifest against Home Assistant
        run: |
          pip install --quiet homeassistant
          python test/ha_import_check.py
      - name: Coordinator analytics wiring
        run: python test/coordinator_analytics_test.py
      - name: Coordinator concurrency stress suite
        run: python test/coordinator_stress_test.py
      - name: Coordinator stale/fresh data-model suite
        run: python test/coordinator_stale_test.py
      - name: Coordinator alert-splitting suite
        run: python test/coordinator_alerts_test.py
      - name: Charger-status start/stop alert suite
        run: python test/coordinator_charger_alert_test.py
      - name: EV-only entity gating (button/number)
        run: python test/entity_gating_test.py
      - name: Domain-service authorization
        run: python test/service_authorization_test.py
      - name: Range-map key wiring
        run: python test/map_keys_test.py
      - name: Coordinator routing budget
        run: python test/coordinator_routing_budget_test.py

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
