# The project standard this repository follows (github.com/Legal-Copy7045/project-standards).
standard: 1.1.0
profile: public            # public | private (only CodeQL upload and nothing else differs)
weekly_slot: "Sun 02:47"   # STANDARD.md 1.6 (CodeQL Sun 04:47)

beyond:                    # more advanced than the baseline, kept on purpose
  - concept: upstream review
    what: >-
      A weekly scheduled review (Monday 09:47 UK) of the reference integration kia_uvo and the Kia/Hyundai library
      reads their changes one by one, builds and releases the small ones and emails the owner about large ones
      (.github/upstream-review.json keeps what was reviewed and what is waiting on the owner). It goes further than
      the version check in .github/upstreams.yaml, which still lists both.
  - concept: page stage
    what: >-
      regression/page/run.js renders both Lovelace cards from fictional fixtures and the car-state gallery in
      Chromium, desktop and phone, with the page origin, Leaflet and map tiles all served locally (no network).
  - concept: vendored map library
    what: >-
      Leaflet ships with the integration and test/card-leaflet-sri.test.js checks the files are byte-identical to
      the published release (SHA-512 = its SRI hash); .gitattributes keeps them byte-for-byte.
  - concept: unit stage
    what: one check per test file (51), so the catalogue names the file that covers each feature.

exceptions:                # done differently or not at all, with the reason
  - rule: "1.5 Dependabot for pip"
    reason: >-
      hyundai_kia_connect_api is ignored: it is pinned identically in requirements.txt and manifest.json, which
      Dependabot can't update together (test/requirements-pin.test.js fails otherwise), and each bump needs the
      upstream review. Other pip updates (none today) go through Dependabot.
  - rule: "1.5 npm ci with a lockfile"
    reason: >-
      No package-lock.json: MagicMirror runs `npm install` in the module folder itself and the module has no
      required dependencies (only the optional mqtt). The npm audit builds a temporary lockfile.
  - rule: "1.3 slow groups"
    reason: >-
      The `module` group in .github/changes.yaml starts no slow job; it only stops MagicMirror and engine changes
      from starting every slow group as unmatched files would.
  - rule: "3.5 walkthrough roles"
    reason: >-
      The cards have no roles, so there is one (`dashboard`). The MagicMirror screen needs MagicMirror itself and is
      a manual check (regression/manual.yaml).
